name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: etl
          POSTGRES_PASSWORD: etl
          POSTGRES_DB: etl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etl -d etl"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_URL: postgresql://etl:etl@localhost:5432/etl
      # S3-совместимое хранилище для тестов — moto server (см. шаг ниже).
      MINIO_ENDPOINT: http://localhost:5000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check src tests scripts
      - name: Ruff format
        run: ruff format --check src tests scripts
      - name: Mypy strict
        run: mypy src
      # S3 для integration-тестов: MinIO больше нельзя анонимно скачать
      # ни с Docker Hub (образы удалены ~сен. 2026), ни с Quay (приватно),
      # поэтому поднимаем moto server — pip-устанавливаемый S3-мок без docker.
      # Наш код ходит в S3 только через boto3 + endpoint_url, ему всё равно.
      - name: Start S3 mock (moto server)
        run: |
          pip install "moto[server]"
          nohup moto_server -H 127.0.0.1 -p 5000 > moto.log 2>&1 &
          for i in $(seq 1 30); do
            python -c "
          import boto3
          boto3.client('s3', endpoint_url='http://127.0.0.1:5000',
                       aws_access_key_id='x', aws_secret_access_key='x',
                       region_name='us-east-1').list_buckets()
          " 2>/dev/null && break
            sleep 2
          done
          python -c "
          import boto3
          print(boto3.client('s3', endpoint_url='http://127.0.0.1:5000',
                             aws_access_key_id='x', aws_secret_access_key='x',
                             region_name='us-east-1').list_buckets())
          "
      - name: Create S3 bucket
        # Не валим весь CI, если мок недоступен: s3-тест сам skip'нется.
        continue-on-error: true
        run: |
          python -c "
          import boto3
          s3 = boto3.client('s3', endpoint_url='http://localhost:5000',
                            aws_access_key_id='minioadmin',
                            aws_secret_access_key='minioadmin',
                            region_name='us-east-1')
          try:
              s3.head_bucket(Bucket='etl-output')
          except Exception:
              s3.create_bucket(Bucket='etl-output')
          "
      - name: Pytest
        run: pytest -v --cov=etl --cov-fail-under=80
      - name: Docker build
        run: docker build -t etl-framework:${{ matrix.python-version }} .
