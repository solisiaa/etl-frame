name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: etl
          POSTGRES_PASSWORD: etl
          POSTGRES_DB: etl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etl -d etl"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_URL: postgresql://etl:etl@localhost:5432/etl
      MINIO_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check src tests scripts
      - name: Ruff format
        run: ruff format --check src tests scripts
      - name: Mypy strict
        run: mypy src
      # MinIO не может работать как `services:` — образу minio/minio нужна
      # команда `server /data`, которую схема services не поддерживает
      # (отсюда был Docker pull/start fail). Поднимаем его обычным docker run.
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data --console-address ":9001"
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done
          curl -sf http://localhost:9000/minio/health/live
      - name: Create MinIO bucket
        # Не валим весь CI, если MinIO недоступен: minio-тест сам skip'нется.
        continue-on-error: true
        run: |
          pip install minio
          python -c "
          from minio import Minio
          c = Minio('localhost:9000', access_key='minioadmin', secret_key='minioadmin', secure=False)
          if not c.bucket_exists('etl-output'): c.make_bucket('etl-output')
          "
      - name: Pytest
        run: pytest -v --cov=etl --cov-fail-under=80
      - name: Docker build
        run: docker build -t etl-framework:${{ matrix.python-version }} .
