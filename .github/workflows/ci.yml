name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: etl
          POSTGRES_PASSWORD: etl
          POSTGRES_DB: etl
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U etl"
          --health-interval 5s --health-timeout 5s --health-retries 10
      minio:
        image: minio/minio:latest
        ports: ["9000:9000", "9001:9001"]
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "mc --help"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      POSTGRES_URL: postgresql://etl:etl@localhost:5432/etl
      MINIO_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check src tests scripts
      - name: Ruff format
        run: ruff format --check src tests scripts
      - name: Mypy strict
        run: mypy src
      - name: Create MinIO bucket
        run: |
          pip install minio
          python -c "
          from minio import Minio
          c = Minio('localhost:9000', access_key='minioadmin', secret_key='minioadmin', secure=False)
          if not c.bucket_exists('etl-output'): c.make_bucket('etl-output')
          "
      - name: Pytest
        run: pytest -v --cov=etl --cov-fail-under=80
      - name: Docker build
        run: docker build -t etl-framework:${{ matrix.python-version }} .
